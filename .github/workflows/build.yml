name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos_26:
        description: Also run the deferred macOS 26 build/headless checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos_26 && '["macos-15","macos-26"]' || '["macos-15"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run standard automatic validation
        env:
          YABAI_FORK_SIGN_IDENTITY: '-'
        run: ./scripts/test-vspace.py headless --output "$RUNNER_TEMP/vspace-tests"
