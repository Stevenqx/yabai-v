name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify ad-hoc signature
        env:
          YABAI_FORK_SIGN_IDENTITY: '-'
        run: ./scripts/build-dev.sh
      - name: Check universal binary
        run: |
          lipo ./bin/yabai -verify_arch x86_64 arm64
          ./bin/yabai --version
      - name: Run headless tests
        run: make -C tests
      - name: Check whitespace and shell syntax
        run: |
          git show --format= --check HEAD
          sh -n scripts/build-dev.sh examples/yabairc.dev
